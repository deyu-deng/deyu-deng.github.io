name = "turtlelet-api"
main = "worker/index.ts"
compatibility_date = "2024-06-01"

# ─── D1 数据库 ───────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "turtlelet-db"
database_id = "394fe7e3-0306-480c-9642-5a277d0817cf"  # Your D1 database ID

# ─── R2 存储桶 ────────────────────────────────────────────
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "turtlelet-files"

# ─── 环境变量（在 Cloudflare Dashboard 的 Workers & Pages > 你的Worker > Settings > Variables 里设置） ───
# ─── 环境变量（绝不要把真值写进这个文件；仓库是公开的） ───────────────────
# 用命令行写入，值不会进入 Git：
#   wrangler secret put JWT_SECRET
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ADMIN_EMAIL
#   wrangler secret put NOTIFY_FROM
#   wrangler secret put ALLOWED_ORIGIN
# JWT_SECRET        = (随机长字符串)
# ADMIN_PASSWORD    = (强密码)
# ALLOWED_ORIGIN    = https://deng-deyu-github-io.pages.dev
